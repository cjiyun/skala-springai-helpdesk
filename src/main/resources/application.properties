spring.application.name=myapp
spring.datasource.url=${HELPDESK_DB_URL:jdbc:postgresql://127.0.0.1:5433/springai}
spring.datasource.username=${HELPDESK_DB_USERNAME:springai}
spring.datasource.password=${HELPDESK_DB_PASSWORD:springai}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.platform=postgresql
spring.ai.openai.api-key=${OPENAI_API_KEY}

server.error.include-message=always
logging.level.com.skala.lab0.myapp=INFO

spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.2
spring.ai.openai.embedding.options.model=text-embedding-3-small
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

lab2.rag.chunk-size=400
lab2.rag.search.min-score=${helpdesk.rag.threshold:0.35}
helpdesk.rag.top-k=5
helpdesk.rag.threshold=0.35
helpdesk.memory.max=20
helpdesk.model.fallback=gpt-4.1-mini
helpdesk.tenant-id=skala

management.endpoints.web.exposure.include=health,info, metrics
management.metrics.distribution.percentiles.ai.latency=0.95
management.metrics.distribution.maximum-expected-value.ai.tokens.per.request=2000
